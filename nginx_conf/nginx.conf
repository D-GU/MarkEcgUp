upstream auth_upstream {
    server auth:8000;
}
upstream ecg_upstream {
    server ecg:8001;
}
upstream usermeta_upstream {
    server user_meta:8002;
}

server {
    listen 80;
    server_name 127.0.0.1;

    location /auth/ {
        proxy_pass http://auth_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /ecg/ {
        proxy_pass http://ecg_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /user_meta/ {
        proxy_pass http://usermeta_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}